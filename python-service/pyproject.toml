[project]
name = "search-flight"
version = "1.0"
description = "CLI that will open a browser with popular flight aggregators and pre-filled search information for you"
keywords = ["cli", "browser", "pre-filled", "airport", "aggregator"]
authors = [{ name = "dobernike", email = "dobernike@mail.ru" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "argparse",
    "fast-flights",
    "fastapi>=0.110.0,<0.116.0",
    "primp==0.11.0",
    "uvicorn>=0.24.0,<0.35.0",
]

[project.urls]
"Source" = "https://github.com/dobernike/search-flight"
"Issues" = "https://github.com/dobernike/search-flight/issues"

[project.scripts]
sfly = "search_flight.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
