[project]
name = "search-flight"
version = "1.0"
description = "CLI that will open a browser with popular flight aggregators and pre-filled search information for you"
keywords = ["cli", "browser", "pre-filled", "airport", "aggregator"]
authors = [{ name = "dobernike", email = "dobernike@mail.ru" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = ["argparse", "fast-flights", "primp==0.11.0"]

[project.urls]
"Source" = "https://github.com/dobernike/search-flight"
"Issues" = "https://github.com/dobernike/search-flight/issues"

[project.scripts]
sfly = "search_flight.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.8",
]
